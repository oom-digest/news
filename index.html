<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Подписка на вечерний дайджест — oom by OKKAM</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2328;
      background-color: #d8dee4;
      background-image: linear-gradient(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.22)), url('digest-header.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 36px 28px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #36b37e;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
    }
    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.5;
      color: #424a53;
    }
    .sub-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sub-input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s;
    }
    .sub-input:focus {
      border-color: #36b37e;
    }
    .sub-btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #36b37e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .sub-btn:hover {
      background-color: #2c9669;
    }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #6e7781;
      line-height: 1.4;
    }

    /* На широких экранах слегка смещаем карточку левее центра, чтобы логотип oom by OKKAM справа оставался полностью открытым */
    @media (min-width: 960px) {
      body {
        justify-content: flex-start;
        padding-left: 14%;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="badge">Внутренняя рассылка от ООМ</span>
    <h1>Вечерний дайджест новостей</h1>
    <p>Главные новости ритейла, авторынка, медицины, недвижимости и диджитал в одном письме каждый вечер от компании ООМ.</p>

    <form class="sub-form" method="POST" action="https://cp.unisender.com/ru/subscribe?hash=6fd9uen6645yc64noyk3nr8h18ro578py8pd64nwmxfixjyrewaho" name="subscribtion_form">
      <input class="sub-input" type="email" name="email" placeholder="Введите ваш рабочий e-mail" required>
      <input type="hidden" name="charset" value="UTF-8">
      <input type="hidden" name="default_list_id" value="8">
      <input type="hidden" name="list_ids[]" value="8">
      <input type="hidden" name="overwrite" value="2">
      <input type="hidden" name="is_v5" value="1">
      <button class="sub-btn" type="submit">Подписаться</button>
    </form>

    <div class="note">После заполнения формы на почту придёт письмо для подтверждения подписки.</div>
  </main>

</body>
</html>
